server {
    listen 80;
    server_name _;

    root /var/www/html/public;
    index index.php;

    # Allow player CSV/XLSX/ODS import up to 10 MB + overhead
    client_max_body_size 16m;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Static assets built by Vite and uploaded club logos via storage:link
    location ~* ^/(build|storage)/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # PHP-FPM
    location ~ \.php$ {
        try_files $uri =404;
        fastcgi_pass app:9000;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include fastcgi_params;

        # Long-running PDF/XLSX exports
        fastcgi_read_timeout 60s;

        # HTML depends on locale cookie: never cache dynamic PHP responses without Vary: Cookie
        add_header Cache-Control "no-store, private" always;
        add_header Vary "Cookie" always;
    }

    # Block hidden files (.env, .git, etc.) and sensitive directories
    location ~ /\.(?!well-known).* {
        deny all;
        return 404;
    }

    location ~* ^/(database|storage|vendor|bootstrap)/ {
        deny all;
        return 404;
    }
}
